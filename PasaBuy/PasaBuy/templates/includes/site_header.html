{% load static %}
<header class="site-header">
  <div class="site-header__brand">
    <a href="{% url 'hero' %}" class="site-header__home">
      <img
        src="{% static 'images/loalogo.png' %}"
        alt="Lyceum of Alabang Logo"
      />
      <span>LYCEUM OF ALABANG</span>
    </a>
  </div>

  <div class="site-header__actions">
    {% if show_post %}
    <a class="site-header__post" id="goPost" href="{% url 'order_page' %}">
      <span class="site-header__post-icon" aria-hidden="true">+</span>
      <span>Post<br />PasaBuy</span>
    </a>
    {% endif %} {% if request.user.is_authenticated %}
    <div class="account-menu">
      <button
        class="user-menu-toggle"
        type="button"
        aria-label="Open account menu"
        aria-expanded="false"
      >
        <span class="user-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.8-3.5 3.2-5.5 7-5.5s6.2 2 7 5.5"></path>
          </svg>
        </span>
      </button>
      <span class="account-name">
        {{ request.user.get_full_name|default:request.user.username }}
      </span>
      <div class="account-panel" hidden>
        <a href="{% url 'user_page' %}">Account Settings</a>
        <a href="{% url 'logout' %}">Log out</a>
      </div>
    </div>
    {% endif %}

    <a href="{% url 'hero' %}" class="site-header__logo"
      >Pasa<span>Buy</span></a
    >
  </div>
</header>
