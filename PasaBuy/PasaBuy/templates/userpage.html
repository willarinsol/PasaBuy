{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Profile | Lyceum of Alabang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'userpage.css' %}">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" aria-label="Notifications">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9aa0ad" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </button>
  <div class="initials" id="initials"></div>
</header>

<main class="frame">
  <h1 class="school">LYCEUM OF ALABANG</h1>

  <section class="body">
    <div class="profile-bar">
      <div class="avatar">
        <img id="avatarImg" alt="" hidden>
        <span class="status" title="Online"></span>
      </div>

      <div class="identity">
        <div class="name-row">
          <h2 class="name" id="fullName"></h2>
          <span class="badge" id="role"></span>
        </div>
        <div class="student-id" id="studentId"></div>
        <div class="program">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="#00205f"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="program"></span>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="pasabuy" type="button">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M6 9h12l-1.2 10a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8z" fill="#fcc419"/><path d="M9 9V7a3 3 0 0 1 6 0v2" fill="none" stroke="#fcc419" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="pasabuyLabel">PasaBuy Food</span>
        </button>
        <button class="btn btn-outline" id="message" type="button">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#00205f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h18v13H8l-5 4z"/><path d="M7 8.5h10M7 11h10M7 13.5h10"/></svg>
          Send Message
        </button>
      </div>
    </div>

    <div class="content">
      <aside class="card contact">
        <h3>Contact Information</h3>

        <div class="contact-item">
          <div class="ico">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2a3df5" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14"/><path d="m2.5 5 9.5 8 9.5-8M2.5 19l7-7M21.5 19l-7-7"/></svg>
          </div>
          <div class="info">
            <span class="label">Email Address</span>
            <span class="value" id="email"></span>
            <span class="verified"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="#2a3df5"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified by Lyceum of Alabang</span>
          </div>
        </div>

        <div class="contact-item">
          <div class="ico">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="#2a3df5"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
          </div>
          <div class="info">
            <span class="label">Phone No.</span>
            <span class="value" id="phone"></span>
            <span class="verified"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z" fill="#2a3df5"/><path d="m8.5 12 2.5 2.5 4.5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified Mobile Number</span>
          </div>
        </div>
      </aside>

      <section class="card reviews" aria-labelledby="reviewsTitle">
        <div class="reviews-head">
          <div>
            <h3 id="reviewsTitle">Rating &amp; Peer Reviews</h3>
            <p class="sub">Evaluated by Lyceum of Alabang students &amp; staff</p>
          </div>
          <span class="pill">
            <svg viewBox="0 0 24 24" fill="#fff"><path d="M2 10h4v11H2zM8 21V10l4-7a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.6 21z"/></svg>
            <span id="positive"></span>
          </span>
        </div>

        <div class="reviews-body">
          <div class="score-box">
            <div class="score" id="score"></div>
            <div class="stars" id="stars" aria-hidden="true"></div>
            <div class="based" id="based"></div>
            <div class="trust" id="trust"></div>
          </div>
          <ul class="criteria" id="criteria"></ul>
        </div>
      </section>
    </div>
  </section>
</main>

<script src="{% static 'script.js' %}"></script>
</body>
</html>
