<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasaBuy - User Authentication</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>

 <!-- HEADER -->
<div class="header">
  <div class="header-left">
    <img src="{% static 'images/loalogo.jpg' %}" class="loalogo" alt="Lyceum of Alabang Logo" />
    <h2>LYCEUM OF ALABANG</h2>
  </div>
  <h1 class="pasabuy-logo">Pasa<span>Buy</span></h1>
</div>

  <!-- MAIN CONTAINER -->
  <div class="page">
    <div class="authenticationcard">

      <!-- TABS SWITCHER -->
      <div class="tabs">
        <button class="tab" id="tab-signin" type="button">Sign In</button>
        <button class="tab active" id="tab-login" type="button">Log In</button>
      </div>

      <!-- SIGN IN VIEW (REGISTRATION / PRE-VALIDATION) -->
      <div id="view-signin" class="view-section">
        <h1>User Authentication</h1>
        <p class="authenticationdescription">
          Institutional security requires pre-validation of an active academic
          or enterprise credential prior to user profile instantiation.
        </p>

        <div class="protocol">◉ MANDATORY ACCESS PROTOCOL</div>

        <form>
          <div class="role-selection">
            <select id="role" name="role">
              <option>Student</option>
              <option>Employee</option>
            </select>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="fullname">Full Name *</label>
              <input type="text" id="fullname" name="fullname" required />
            </div>

            <div class="form-group">
              <label for="idnumber">Student ID / Employee ID *</label>
              <input type="text" id="idnumber" name="idnumber" required />
            </div>

            <div class="form-group graduation">
              <label for="graduation">Expected Graduation Term *</label>
              <input type="text" id="graduation" name="graduation" required />
            </div>
          </div>

          

          <button class="submit-btn" type="submit">
            Submit for Verification
          </button>
        </form>
      </div>

      <!-- LOG IN VIEW -->
      <div id="view-login" class="view-section active">
        <form class="login-container">
          <div class="login-field">
            <label for="login-username">USERNAME</label>
            <div class="input-wrapper">
              <input type="text" id="login-username" name="username" required />
            </div>
          </div>

          <div class="login-field">
            <label for="login-password">PASSWORD</label>
            <div class="input-wrapper">
              <input type="password" id="login-password" name="password" required />
              <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Toggle Password Visibility">
                <svg id="eye-icon" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button class="login-btn" type="submit">Log in</button>
        </form>
      </div>

    </div>
  </div>

  <script src="{% static 'script.js' %}"></script>
</body>
</html>
